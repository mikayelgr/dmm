name: CI
on: [push]

jobs:
  kmp__build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update
      - run: sudo apt install -y openjdk-21-jdk build-essential cmake gcc libeigen3-dev
      - run: cd kmp && ./gradlew clean build nativeTest --console=plain

  jni__build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update
      - run: sudo apt install -y openjdk-21-jdk build-essential cmake gcc libeigen3-dev
      - run: cd jvm && ./gradlew clean build test --console=plain

  kmp__build-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake eigen openjdk@21
      - run: cd kmp && ./gradlew clean build nativeTest --console=plain

  jni__build-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake eigen openjdk@21
      - run: cd jvm && ./gradlew clean build test --console=plain
